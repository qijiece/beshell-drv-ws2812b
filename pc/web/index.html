<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WS2812B 灯效编辑器</title>
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <div id="topbar">
        <span class="app-title">WS2812B 灯效编辑器</span>
        <div class="topbar-actions">
            <span id="wasm-status" class="wasm-status">WASM 未载入</span>
            <button id="btn-verify" title="把当前工程经引擎 importConfig/exportConfig 往返校验">引擎往返验证</button>
            <button id="btn-new" class="icon-btn" title="新建项目"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
            <button id="btn-projects" class="icon-btn" title="打开项目"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg></button>
            <button id="btn-settings" class="icon-btn" title="设置项目（名称/说明）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
            <button id="btn-quick-save" class="icon-btn" title="一键保存当前工程（覆盖；无项目时打开命名）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
            <button id="btn-export">导出 JSON</button>
            <button id="btn-import">导入 JSON</button>
            <button id="btn-export-code">生成代码</button>
            <input type="file" id="file-import" accept="application/json,.json" hidden>
        </div>
    </div>

    <div id="main">
        <div id="preview">
            <canvas id="preview-canvas"></canvas>
            <div id="layout-panel"></div>
            <label id="preview-hide-ui" title="勾选后，播放时自动隐藏分段框、手柄、端点图标等灯带上的 UI 元素"><input type="checkbox" id="chk-hide-ui-playing"> 播放时隐藏灯带上的 UI</label>
        </div>
        <div id="sidebar"></div>
    </div>

    <div id="timeline"></div>

    <script src="beshell-ws2812b-wasm.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
